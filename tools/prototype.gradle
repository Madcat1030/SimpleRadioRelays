// Both names contain the same runtime-only JAR. No class rewriting or shrinking.
tasks.register('prototypeJar', Copy) {
    group = 'build'
    description = 'Copy the normal release JAR under the familiar prototype filename.'
    dependsOn tasks.named('remapJar')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into(layout.buildDirectory.dir('libs'))
    rename { "${base.archivesName.get()}-${project.version}-prototype.jar" }
}
