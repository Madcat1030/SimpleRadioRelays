plugins {
    id 'fabric-loom' 
    id 'maven-publish'
}

version = rootProject.foci_version
group = project.maven_group
base { archivesName = 'simple-radio-repeaters-dimensional-foci-fabric-1.20.1' }

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    mavenCentral()
}

dependencies {
    implementation project(path: ':core', configuration: 'namedElements')
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
    // Provided at runtime by Fabric Loader; compile the composable expression hooks against its API.
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.5+1.20.1'
    modImplementation 'maven.modrinth:simple-radio:f9TIjf7X'
    modImplementation 'maven.modrinth:lexiconfig:NfIErT11'
    modImplementation 'maven.modrinth:simple-voice-chat:fabric-1.20.1-2.6.18'
    // Loom's development classpath does not unpack Lexiconfig's bundled non-mod libraries.
    runtimeOnly 'com.electronwill.night-config:core:3.6.6'
    runtimeOnly 'com.electronwill.night-config:toml:3.6.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    mods {
        simpleradio_repeaters { sourceSet project(':core').sourceSets.main }
        simpleradio_repeaters_foci { sourceSet sourceSets.main }
    }

    mixin { useLegacyMixinAp = true; defaultRefmapName = 'simpleradio_repeaters_foci.refmap.json' }
    runs {
        server { runDir 'run/server' }
        gameTest {
            server()
            name 'Repeater Game Tests'
            runDir 'run/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=reports/gametest-report.xml'
        }

    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'foci_api_version', rootProject.foci_required_api_version
    filesMatching('fabric.mod.json') { expand version: project.version }
    doLast {
        def metadataFile = new File(destinationDir, 'fabric.mod.json')
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        metadata.custom['simpleradio_repeaters:foci_api'] = Integer.parseInt(rootProject.foci_required_api_version)
        metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n'
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
test { useJUnitPlatform() }
jar { from(rootProject.file('LICENSE')) { rename { "${it}_${project.base.archivesName.get()}" } } }

// Optional distribution copy: ./gradlew prototypeJar
apply from: rootProject.file('tools/prototype.gradle')

apply from: rootProject.file('tools/gametest.gradle')

dependencies { gametestImplementation rootProject.project(':core').sourceSets.gametest.output }
loom.mods { simpleradio_repeaters_tests { sourceSet project(':core').sourceSets.gametest } }
