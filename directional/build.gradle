plugins { id 'fabric-loom' }

evaluationDependsOn(':core')
if (project.hasProperty('withFoci')) evaluationDependsOn(':foci')

version = '0.2.4'
group = project.maven_group
base { archivesName = 'simple-radio-directional-antenna-fabric-1.20.1' }

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    mavenCentral()
}
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.5+1.20.1'
    modImplementation 'maven.modrinth:simple-radio:f9TIjf7X'
    modImplementation 'maven.modrinth:lexiconfig:NfIErT11'
    modImplementation 'maven.modrinth:simple-voice-chat:fabric-1.20.1-2.6.18'
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    // Optional integration is compiled against the API, never bundled or required at runtime.
    compileOnly project(path: ':core', configuration: 'namedElements')
    if (project.hasProperty('withRepeaters') || project.hasProperty('withFoci'))
        runtimeOnly project(path: ':core', configuration: 'namedElements')
    if (project.hasProperty('withFoci'))
        runtimeOnly project(path: ':foci', configuration: 'namedElements')
    runtimeOnly 'com.electronwill.night-config:core:3.6.6'
    runtimeOnly 'com.electronwill.night-config:toml:3.6.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
loom {
    mods {
        simpleradio_directional { sourceSet sourceSets.main }
        if (project.hasProperty('withRepeaters') || project.hasProperty('withFoci'))
            simpleradio_repeaters { sourceSet project(':core').sourceSets.main }
        if (project.hasProperty('withFoci'))
            simpleradio_repeaters_foci { sourceSet project(':foci').sourceSets.main }
    }
    mixin { useLegacyMixinAp = true; defaultRefmapName = 'simpleradio_directional.refmap.json' }
    runs {
        gameTest {
            server()
            name 'Directional Antenna Game Tests'
            runDir 'run/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=reports/gametest-report.xml'
        }
    }
}
// Keep the editable whole-dish JSON authoritative. Fixed mounting cubes are split at build time.
def generatedDishModels = layout.buildDirectory.dir('generated/dish-models')
tasks.register('generateDishModels') {
    inputs.file('src/main/resources/assets/simpleradio_directional/models/block/parabolic_receiver.json')
    inputs.file('src/main/resources/assets/simpleradio_directional/models/block/wide_angle_receiver.json')
    outputs.dir(generatedDishModels)
    doLast {
        ['parabolic_receiver', 'wide_angle_receiver'].each { modelName ->
        def model = new groovy.json.JsonSlurper().parse(file("src/main/resources/assets/simpleradio_directional/models/block/${modelName}.json"))
        def fixed = { element -> element.name in ['mast_clamp', 'mounting_arm'] || element.name?.startsWith('mount_') }
        def mount = model.elements.findAll(fixed)
        def head = model.elements.findAll { !fixed(it) }
        if (mount.isEmpty() || head.isEmpty()) throw new GradleException('Dish model needs fixed mounting cubes (mount_ prefix) and a separate reflector.')
        def output = generatedDishModels.get().asFile
        def writeJson = { String name, Object value ->
            def file = new File(output, 'assets/simpleradio_directional/' + name)
            file.parentFile.mkdirs()
            file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(value)) + '\n'
        }
        writeJson("models/block/${modelName}_mount.json", model + [elements: mount])
        writeJson("models/block/${modelName}_head.json", model + [elements: head])
        (0..6).each { aim -> writeJson("models/block/${modelName}_aim_${aim}.json", [parent: "simpleradio_directional:block/${modelName}_head"]) }
        def parts = []
        [north: 0, east: 90, south: 180, west: 270].each { facing, yaw ->
            parts.add([when: [facing: facing], apply: [model: "simpleradio_directional:block/${modelName}_mount", y: yaw]])
            (0..6).each { aim -> parts.add([when: [facing: facing, aim: aim.toString()],
                    apply: [model: "simpleradio_directional:block/${modelName}_aim_${aim}", y: yaw]]) }
        }
        writeJson("blockstates/${modelName}.json", [multipart: parts])
        }
    }
}
sourceSets.main.resources.srcDir(generatedDishModels)
processResources {
    dependsOn tasks.named('generateDishModels')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.named('sourcesJar') { dependsOn tasks.named('generateDishModels') }
test { useJUnitPlatform() }
jar { from(rootProject.file('LICENSE')) { rename { "${it}_${project.base.archivesName.get()}" } } }

// Runtime copy excludes this module's GameTest fixtures. No shrinking or obfuscation.
tasks.register('prototypeJar', Zip) {
    dependsOn tasks.named('remapJar')
    archiveFileName = "${base.archivesName.get()}-${project.version}-prototype.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from({ zipTree(tasks.named('remapJar').get().archiveFile.get().asFile) }) {
        exclude 'dev/paul/simpleradiodirectional/gametest/**', 'fabric.mod.json'
    }
    doFirst {
        def descriptor = new groovy.json.JsonSlurper().parse(file("$buildDir/resources/main/fabric.mod.json"))
        descriptor.entrypoints.remove('fabric-gametest')
        def output = file("$buildDir/prototype/fabric.mod.json")
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(descriptor)) + '\n'
    }
    from(layout.buildDirectory.file('prototype/fabric.mod.json'))
}
