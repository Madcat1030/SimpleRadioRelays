gradle.projectsEvaluated {
    def project = gradle.rootProject.project(':directional')
    def qa = new File(project.projectDir, 'validation/0.2.2/preview')
    def compileQa = project.tasks.register('compileAlternatesPreview', JavaCompile) {
        dependsOn project.tasks.named('classes')
        source project.fileTree(new File(qa, 'java')) { include '**/*.java' }
        classpath = project.sourceSets.main.runtimeClasspath
        destinationDirectory = new File(qa, 'classes')
        options.release = 17
    }
    def qaJar = project.tasks.register('alternatesPreviewJar', Jar) {
        dependsOn compileQa
        archiveFileName = 'parabolic-alternates-native-preview.jar'
        destinationDirectory = project.file('run/mods')
        from new File(qa, 'classes')
        from new File(qa, 'resources')
    }
    project.tasks.named('runClient') { dependsOn qaJar }
    // A visual QA session needs fonts and native textures, not the full music/sound asset download.
    project.tasks.matching { it.name == 'downloadAssets' }.configureEach { enabled = false }
}
